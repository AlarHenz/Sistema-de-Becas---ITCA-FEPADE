<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ITCA FEPADE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados */
        .bg-login-1 {
            background: linear-gradient(135deg, rgba(166, 20, 20, 0.95) 0%, rgba(166, 20, 20, 0.85) 40%, rgba(0, 0, 0, 0.2) 100%), 
                        url('https://via.placeholder.com/1920x1080?text=Fondo+ITCA') no-repeat center center;
            background-size: cover;
            color: white;
        }
        .text-gold {
            color: #d4a017;
        }
        .login-card {
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn-red {
            background-color: #a61414;
            color: white;
            font-weight: 600;
        }
        .btn-red:hover {
            background-color: #851010;
            color: white;
        }
        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .gold-divider {
            border-top: 3px solid #d4a017;
            width: 80px;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-login-1 vh-100 d-flex align-items-center">

    <div class="container">
        <div class="row w-100 align-items-center">
            
            <!-- Sección de Textos (Izquierda) -->
            <div class="col-lg-6 d-flex flex-column justify-content-center mb-5 mb-lg-0 px-4">
                <h3 class="fw-bold mb-0">ITCA FEPADE</h3>
                <p class="small mb-5 tracking-wide">TÉCNICOS E INGENIEROS</p>
                
                <h1 class="fw-bold display-4 lh-sm">
                    Accede a tu<br>
                    Sistema de<br>
                    <span class="text-gold">Gestión de Becas</span>
                </h1>
                <div class="gold-divider my-4"></div>
                <p class="fs-5" style="max-width: 400px;">
                    Plataforma institucional para la gestión de solicitudes y seguimiento de becas.
                </p>
            </div>
            
            <!-- Sección del Formulario (Derecha) -->
            <div class="col-lg-5 offset-lg-1">
                <div class="card login-card border-0 bg-white">
                    <div class="card-body">
                        <h4 class="text-center fw-bold mb-4 text-dark">Inicia sesión</h4>
                        
                        <!-- Contenedor para Alertas Condicionales -->
                        <div id="alertError" class="alert alert-danger d-none text-center" role="alert">
                            <!-- El mensaje de error se inyectará aquí con JS -->
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="carnet" class="form-label text-dark fw-medium">Carnet</label>
                                <input type="text" class="form-control py-2" id="carnet" placeholder="Ingresa tu número de carnet" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-dark fw-medium">Contraseña</label>
                                <input type="password" class="form-control py-2" id="password" placeholder="Ingresa tu contraseña" required>
                            </div>
                            <div class="d-grid mt-2">
                                <button type="submit" class="btn btn-red py-2" id="btnLogin">INGRESAR</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- LÓGICA DE VALIDACIÓN (Simulando H7 en Vanilla JS) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 3. RUTAS PROTEGIDAS (Simulación):
            // Si el usuario ya tiene sesión iniciada, lo mandamos al dashboard
            if (localStorage.getItem("token_acceso")) {
                window.location.href = "dashboard.html";
            }

            const loginForm = document.getElementById("loginForm");
            const alertError = document.getElementById("alertError");
            const inputCarnet = document.getElementById("carnet");
            const inputPassword = document.getElementById("password");

            // 1. CAPTURAR CREDENCIALES
            loginForm.addEventListener("submit", function(e) {
                e.preventDefault(); // Evita que la página se recargue

                const carnetValue = inputCarnet.value.trim();
                const passwordValue = inputPassword.value.trim();

                // Simulamos una base de datos de estudiantes
                const bdSimulada = {
                    "012345": "secreto123", // carnet: contraseña
                    "543210": "admin123"
                };

                // 2. RENDERIZADO CONDICIONAL DE ALERTAS
                // Ocultar alerta previa por si existía
                alertError.classList.add("d-none");
                alertError.textContent = "";

                // Validación contra nuestros "registros"
                if (!bdSimulada.hasOwnProperty(carnetValue)) {
                    // El carnet no existe en la BD simulada
                    alertError.textContent = "Registro no encontrado. Verifica tu carnet.";
                    alertError.classList.remove("d-none");
                } else if (bdSimulada[carnetValue] !== passwordValue) {
                    // El carnet existe pero la contraseña es incorrecta
                    alertError.textContent = "Credenciales inválidas. Contraseña incorrecta.";
                    alertError.classList.remove("d-none");
                } else {
                    // Simular inicio de sesión exitoso
                    // Guardamos un token falso en el almacenamiento local del navegador
                    localStorage.setItem("token_acceso", "ey123456789.token.falso");
                    
                    // Redirigimos a la vista interna (Rutas Protegidas)
                    window.location.href = "dashboard.html"; 
                }
            });
        });
    </script>
</body>
</html>
